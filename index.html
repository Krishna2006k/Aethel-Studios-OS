    <script>
      // Capture beforeinstallprompt early before React hydration so mobile Chrome never misses it
      window.__aethelDeferredPrompt = null;
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__aethelDeferredPrompt = e;
        window.dispatchEvent(new CustomEvent('aethel-pwa-prompt-ready'));
      });
    </script>
